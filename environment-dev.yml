# Development environment for blimp.
#
#   conda env create -f environment-dev.yml
#   conda activate blimp-dev
#   pip install -e ".[test,dev]"        # editable install + tox/pytest/pre-commit
#   pre-commit install                  # optional: run hooks on commit
#   tox -e offline                      # fast check, no network or reference data
#
# conda-forge supplies the compiled stack; the pip-only dependencies arrive via
# `pip install -e .`. Do not duplicate a dependency in both places -- that is
# how you get two copies and an import resolving to the wrong one.
name: blimp-dev
channels:
-   conda-forge
dependencies:
# Python: 3.11-3.12 are the versions tox tests. 3.11 is a reasonable default.
-   python=3.11
-   pip
# Compiled scientific core (also in requirements.txt; conda-forge builds are
# preferred over wheels for these).
-   numpy>=1.23.0
-   pandas>=1.5.2
-   matplotlib-base>=3.6.3
-   scikit-image>=0.21.0
-   simpleitk>=2.1.0
-   mahotas>=1.4.13
-   tomli>=2.0.1
-   packaging>=23.0
-   typing_extensions>=4.4.0
-   importlib_metadata>=5.1.0
# Duplicates the [test]/[dev] extras on purpose, so `conda env create` alone
# gives a usable environment.
-   tox
-   pytest
-   pytest-cov
-   pytest-dependency
-   pre-commit>=2.9.0
# setuptools_scm is a build requirement (see [build-system] in pyproject.toml)
# and needs the git history, so develop from a clone rather than a source zip.
-   setuptools
-   setuptools_scm
