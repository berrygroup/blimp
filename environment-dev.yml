# Development environment for blimp.
#
#   conda env create -f environment-dev.yml
#   conda activate blimp-dev
#   pip install -e ".[test,dev]"        # editable install + tox/pytest/pre-commit
#   pre-commit install                  # optional: run hooks on commit
#   tox -e offline                      # fast check, no network or reference data
#
# Why the split between conda and pip:
#   - conda-forge supplies the compiled scientific stack (numpy/scipy/scikit-image/
#     SimpleITK/mahotas). These are the packages where a wheel/BLAS mismatch is
#     painful, so let the solver handle them.
#   - The remaining blimp dependencies (aicsimageio[nd2], itk-elastix, cellpose,
#     nd2reader, pystackreg, welford) are pip-only or their extras are not
#     expressible in conda, so they arrive via `pip install -e .` from
#     requirements.txt. Do not duplicate them here -- listing a dependency in
#     both places is how you end up with two copies and an import that resolves
#     to the wrong one.
#
# numcodecs is pinned <0.16 to match requirements.txt: aicsimageio pulls zarr 2.x,
# which imports a numcodecs symbol removed in 0.16.
name: blimp-dev
channels:
-   conda-forge
dependencies:
# Python: 3.10-3.12 are the versions tox tests. 3.11 is a reasonable default.
-   python=3.11
-   pip
# Compiled scientific core (also in requirements.txt; conda-forge builds are
# preferred over wheels for these).
-   numpy>=1.23.0
-   pandas>=1.5.2
-   matplotlib-base>=3.6.3
-   scikit-image>=0.21.0
-   simpleitk>=2.1.0
-   mahotas>=1.4.13
-   numcodecs<0.16
-   tomli>=2.0.1
-   packaging>=23.0
-   typing_extensions>=4.4.0
-   importlib_metadata>=5.1.0
# Test and dev tooling. These duplicate the [test]/[dev] extras on purpose, so
# that `conda env create` alone gives you a usable environment; `pip install -e
# ".[test,dev]"` afterwards is then a no-op for them.
-   tox
-   pytest
-   pytest-cov
-   pytest-dependency
-   pre-commit>=2.9.0
# setuptools_scm is a build requirement (see [build-system] in pyproject.toml)
# and needs the git history, so develop from a clone rather than a source zip.
-   setuptools
-   setuptools_scm
