# NOTE: pytest configuration lives in pyproject.toml under
# [tool.pytest.ini_options]. pytest ignores a [pytest] section here whenever
# that table exists, so do not re-add one -- it will be silently inert.

[doc8]
max-line-length = 120
ignore-path = .tox,docs/api,blimp.egg-info,dist,build
quiet = 1

[flake8]
per-file-ignores =
    */__init__.py: D104, F401, I252
    tests/*: D, PT019
    docs/*: D,B
    notebooks/*: E402, E501, D100
# E402 module level import not at top of file
# E501 line too long
# D104 Missing docstring in public package
# F401 ... imported but unused
# D100 Missing docstring in public module
# D200 One-line docstring should fit on one line with quotes
# G004 Logging statement uses f-string
# G003 Logging statement uses '+'

# D100 D100 Missing docstring in public module
# D107 Missing docstring in __init__
# B008 Do not perform function calls in argument defaults.
# W503 line break before binary operator
# D105 Missing docstring in magic method
# E203 whitespace before ':'
# P101 format string does contain unindexed parameters
# PT019 fixture _ensure_test_data without value is injected as parameter, use @pytest.mark.usefixtures instead

# docrep interferences:
# RST201 Block quote ends without a blank line; unexpected unindent.
# RST301 Unexpected indentation.
# RST306 Unknown target name:
# RST203 Definition list ends without a blank line; unexpected unindent.
ignore = E203, D200, D100, D107, G004, G003 #,B008,W503,D105,E203,P101,RST201,RST301,RST306,RST203
exclude =
    .git
    .tox
    build
    dist
    __pycache__
    setup.py
max_line_length = 120
filename = *.py
ban-relative-imports = true
rst-roles =
    mod
    class
    meth
    func
    attr
    paramref
    ref
    cite
rst-directives =
    envvar
    exception

[coverage:run]
# `source` confines measurement to the package. Without it, coverage measures
# whatever happens to be imported -- a full run picked up a vendored
# `imagecodecs` tree in the repo root and reported an unparseable .pyx file,
# and the headline percentage was diluted by test files scoring ~100%.
source = blimp
omit = */__init__.py
# Record paths relative to the repo root rather than absolute. Without this the
# XML carries `<source>/Users/you/src/blimp/blimp</source>`, which differs on
# every machine and on each CI runner OS, so Codecov has to guess how to map
# files onto the repo tree -- and the six matrix uploads do not merge into one
# coherent report. With it, `<source>` is just `blimp`.
relative_files = True

[coverage:paths]
source =
    blimp
    */site-packages/blimp

[coverage:report]
show_missing = true
precision = 2
skip_empty = True
sort = Cover

[tox]
isolated_build = True
# tox provisions tox-uv itself when it is missing, so a contributor with only
# `pip install tox` gets the same behaviour as one who installed the plugin.
# uv supplies any interpreter the matrix needs that is not already on PATH,
# which is what makes skip_missing_interpreters = false below safe to set.
requires =
    tox-uv>=1.36
# NOTE: covclean MUST come before the py* envs. `coverage erase` wipes the
# accumulated .coverage data file, so running it *after* the test envs (as it
# was) left the `coverage` env with nothing to report -- it failed with "No data
# to report" on every full `tox` run.
envlist =
    covclean
    py{310,311,312}-{linux,macos}
    lint
    clean-docs
    check-docs
    docs
    coverage
# false, not true. With true, a leg whose interpreter is absent reports SKIP and
# a whole-envlist `tox` run still exits 0 -- so the entire matrix silently ran
# nothing but py311 and looked green. With false a missing interpreter is a
# FAIL. This does NOT affect the platform guard: the -linux legs still SKIP
# cleanly on macOS (and vice versa), because that is a platform mismatch rather
# than a missing interpreter. Measured both ways.
skip_missing_interpreters = false

[testenv]
# uv-venv-runner, not the default virtualenv runner: it builds these envs in
# ~50 s rather than ~250 s, and it downloads a missing interpreter on demand.
# NOT uv-venv-lock-runner -- that one runs `uv sync --locked` and fails without
# a uv.lock, which this project does not have.
#
# In CI this defers to whatever actions/setup-python put on PATH: uv is invoked
# with --python-preference system, so it reuses that interpreter instead of
# downloading its own. Verified: no download occurred for a version already on
# PATH.
runner = uv-venv-runner
platform =
    linux: linux
    macos: (osx|darwin)
deps =
    pytest
    pytest-xdist
    pytest-cov
    pytest-dependency
    nbconvert
    ipykernel
extras = test
usedevelop = true
# The reference dataset (~200 MB) is fetched from Figshare before the suite
# runs. ``blimp.data.load_test_data`` is a no-op when the dataset is already
# extracted, so this costs nothing on repeat runs.
# Set BLIMP_SKIP_TEST_DATA=1 to run only the offline tests without network
# access; the data-dependent tests then skip rather than fail.
setenv =
    BLIMP_SKIP_TEST_DATA = {env:BLIMP_SKIP_TEST_DATA:0}
commands_pre =
    python {toxinidir}/tests/fetch_test_data.py
# --cov-report=xml is needed by CI (Codecov upload) and by the badge in the
# `coverage` env. Without it `tox -e py` writes only a terminal report, and the
# CI upload step silently finds no file.
commands =
    python -m pytest --cov --cov-append --cov-report=term-missing --cov-report=xml:{toxinidir}/tests/coverage/coverage.xml --junitxml={toxinidir}/tests/coverage/junit.xml --cov-config={toxinidir}/tox.ini --ignore docs/ {posargs:-vv} {env:PYTEST_FLAGS:}

[testenv:offline]
description = Run only the tests that need no network access or reference data.
extras = test
usedevelop = true
deps =
    pytest
    pytest-cov
commands = python -m pytest -m "not data" --cov --cov-report=term-missing {posargs}

[testenv:lint]
description = Perform linting.
# No basepython pin. This env sets skip_install, and pre-commit builds its own
# isolated environment per hook at the pinned rev, so the interpreter tox uses
# here has no bearing on the result. Pinning python3.10 meant the env silently
# SKIPped on any machine without a 3.10 on PATH:
#     lint: skipped because could not find python interpreter with spec(s): python3.10
deps = pre-commit>=2.16.0
skip_install = true
# skip_install means blimp is absent, so the inherited dataset fetch in
# [testenv] can only print "Could not import blimp". Override it away.
commands_pre =
commands = pre-commit run --all-files {posargs:}  # --show-diff-on-failure

[testenv:covclean]
description = Clean coverage files.
deps = coverage
skip_install = True
# These envs set skip_install, so blimp is absent and the inherited
# commands_pre dataset fetch can only print "Could not import blimp". They do
# not touch the dataset, so override it away.
commands_pre =
commands = coverage erase

[testenv:coverage]
description = Report the coverage.
deps =
    coverage
skip_install = true
depends = py{310,311,312}-{linux,macos}
parallel_show_output = True
commands_pre =
commands =
    coverage report --omit="tox/*,tests/*"
    coverage xml --omit="tox/*,tests/*" -o {toxinidir}/tests/coverage/coverage.xml
    coverage html --omit="tox/*,tests/*" -d {toxinidir}/tests/coverage/html
# NOTE: two `genbadge` steps used to follow, writing coverage.svg and tests.svg.
# They were removed: genbadge fetches the badge image from img.shields.io, so the
# env could not run without network access, and the SVGs it produced were
# gitignored and referenced by nothing. The README's coverage badge is served
# live by Codecov from the XML uploaded by CI.

[testenv:clean-docs]
description = Clean the documentation artifacts.
# No basepython pin -- see the note in [testenv:lint].
deps =
skip_install = true
commands_pre =
changedir = {toxinidir}/docs
whitelist_externals = make
allowlist_externals = make
commands = make clean

[testenv:check-docs]
description = Check whether the links in the documentation are valid.
# No basepython pin -- see the note in [testenv:lint].
deps = -r{toxinidir}/docs/requirements.txt
skip_install = true
commands_pre =
whitelist_externals = sphinx-build
commands =
    sphinx-build -W --keep-going -b spelling {toxinidir}/docs {toxinidir}/docs/_build/spellcheck
    sphinx-build -q -W --keep-going -b linkcheck {toxinidir}/docs {toxinidir}/docs/_build/linkcheck

[testenv:docs]
description = Build the documentation.
# No basepython pin -- see the note in [testenv:lint].
skip_install = true
deps = -r{toxinidir}/docs/requirements.txt
commands_pre =
whitelist_externals = sphinx-build
commands =
#    sphinx-apidoc -f -o {toxinidir}/docs {toxinidir}
    sphinx-build --color -b html {toxinidir}/docs {toxinidir}/docs/_build/html
    python -c 'import pathlib; print(f"Documentation is available under:", pathlib.Path(f"{toxinidir}") / "docs" / "_build" / "html" / "index.html")'

