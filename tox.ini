# pytest config lives in pyproject.toml. Do not add a [pytest] section here:
# it is silently inert while [tool.pytest.ini_options] exists.

[doc8]
max-line-length = 120
ignore-path = .tox,docs/api,blimp.egg-info,dist,build
quiet = 1

[flake8]
per-file-ignores =
    */__init__.py: D104, F401, I252
    tests/*: D, PT019
    docs/*: D,B
    notebooks/*: E402, E501, D100
# E402 module level import not at top of file
# E501 line too long
# D104 Missing docstring in public package
# F401 ... imported but unused
# D100 Missing docstring in public module
# D200 One-line docstring should fit on one line with quotes
# G004 Logging statement uses f-string
# G003 Logging statement uses '+'

# D100 D100 Missing docstring in public module
# D107 Missing docstring in __init__
# B008 Do not perform function calls in argument defaults.
# W503 line break before binary operator
# D105 Missing docstring in magic method
# E203 whitespace before ':'
# P101 format string does contain unindexed parameters
# PT019 fixture _ensure_test_data without value is injected as parameter, use @pytest.mark.usefixtures instead

# docrep interferences:
# RST201 Block quote ends without a blank line; unexpected unindent.
# RST301 Unexpected indentation.
# RST306 Unknown target name:
# RST203 Definition list ends without a blank line; unexpected unindent.
ignore = E203, D200, D100, D107, G004, G003 #,B008,W503,D105,E203,P101,RST201,RST301,RST306,RST203
exclude =
    .git
    .tox
    build
    dist
    __pycache__
    setup.py
max_line_length = 120
filename = *.py
ban-relative-imports = true
rst-roles =
    mod
    class
    meth
    func
    attr
    paramref
    ref
    cite
rst-directives =
    envvar
    exception

[coverage:run]
# `source` is required: without it coverage measures whatever gets imported,
# including vendored trees in the repo root, and test files scoring ~100%
# dilute the headline figure.
source = blimp
omit = */__init__.py
# Absolute paths differ per machine and per CI runner, so Codecov cannot merge
# the six matrix uploads into one report.
relative_files = True

[coverage:paths]
source =
    blimp
    */site-packages/blimp

[coverage:report]
show_missing = true
precision = 2
skip_empty = True
sort = Cover

[tox]
isolated_build = True
# Self-provisioned when missing, so `pip install tox` is the only prerequisite.
# uv supplies interpreters absent from PATH, which is what makes
# skip_missing_interpreters = false below safe.
requires =
    tox-uv>=1.36
# covclean MUST stay before the py* envs: `coverage erase` after them wipes the
# accumulated data and the coverage env fails with "No data to report".
envlist =
    covclean
    py{310,311,312}-{linux,macos}
    lint
    clean-docs
    check-docs
    docs
    coverage
# Must stay false: with true, a missing interpreter is a SKIP and a full `tox`
# exits 0, so a matrix that ran only one leg still looks green. The -linux legs
# skip cleanly on macOS regardless -- platform mismatch, not a missing
# interpreter.
skip_missing_interpreters = false

[testenv]
# Builds these envs in ~50 s rather than ~250 s, and fetches a missing
# interpreter on demand. Not uv-venv-lock-runner: that runs `uv sync --locked`
# and fails without a uv.lock. In CI it defers to setup-python's interpreter
# (uv runs with --python-preference system) rather than downloading its own.
runner = uv-venv-runner
platform =
    linux: linux
    macos: (osx|darwin)
deps =
    pytest
    pytest-xdist
    pytest-cov
    pytest-dependency
    nbconvert
    ipykernel
extras = test
usedevelop = true
# Fetches the ~200 MB reference dataset; a no-op once extracted. Exits non-zero
# if it cannot, failing the run rather than silently dropping the 73 tests that
# need it. Use `tox -e offline` to select the data-free subset deliberately.
commands_pre =
    python {toxinidir}/tests/fetch_test_data.py
# --cov-report=xml is required: without it the CI upload step silently finds
# no file.
commands =
    python -m pytest --cov --cov-append --cov-report=term-missing --cov-report=xml:{toxinidir}/tests/coverage/coverage.xml --junitxml={toxinidir}/tests/coverage/junit.xml --cov-config={toxinidir}/tox.ini --ignore docs/ {posargs:-vv} {env:PYTEST_FLAGS:}

[testenv:offline]
description = Run only the tests that need no network access or reference data.
extras = test
usedevelop = true
deps =
    pytest
    pytest-cov
commands = python -m pytest -m "not data" --cov --cov-report=term-missing {posargs}

[testenv:lint]
description = Perform linting.
# Deliberately no basepython: pre-commit builds its own env per hook, so the
# interpreter here has no bearing on the result, and pinning one makes this env
# SKIP on any machine without that exact version on PATH.
deps = pre-commit>=2.16.0
skip_install = true
# Override away the inherited dataset fetch: skip_install means blimp is absent.
commands_pre =
commands = pre-commit run --all-files {posargs:}  # --show-diff-on-failure

[testenv:covclean]
description = Clean coverage files.
deps = coverage
skip_install = True
# As above: skip_install, and these envs do not touch the dataset.
commands_pre =
commands = coverage erase

[testenv:coverage]
description = Report the coverage.
deps =
    coverage
skip_install = true
depends = py{310,311,312}-{linux,macos}
parallel_show_output = True
commands_pre =
commands =
    coverage report --omit="tox/*,tests/*"
    coverage xml --omit="tox/*,tests/*" -o {toxinidir}/tests/coverage/coverage.xml
    coverage html --omit="tox/*,tests/*" -d {toxinidir}/tests/coverage/html

[testenv:clean-docs]
description = Clean the documentation artifacts.
deps =
skip_install = true
commands_pre =
allowlist_externals = rm
# docs/Makefile has no `clean` target: it falls through to the catch-all `%:`
# rule, which shells out to sphinx-build. That is unusable in an env that
# installs nothing (deps is empty), so this deletes the directories directly.
# api/ is autosummary output and must go too -- `sphinx-build -M clean` removes
# only _build/, so stale entries there survived a rename and turned into
# fatal warnings under -W in check-docs.
commands =
    rm -rf {toxinidir}/docs/_build
    rm -rf {toxinidir}/docs/api

[testenv:check-docs]
description = Check whether the links in the documentation are valid.
deps = -r{toxinidir}/docs/requirements.txt
skip_install = true
commands_pre =
allowlist_externals = sphinx-build
# Ran a `-b spelling` build first until 2026-08. sphinxcontrib-spelling needs
# the enchant C library, which pip cannot supply, so this env could not
# complete on a machine without it -- and the spelling config it needed was
# never present either (no spelling_wordlist.txt, and spelling_filters pointed
# at a docs/source/utils.py that does not exist in this repo). linkcheck runs
# second, so it never ran at all. Reinstating spelling means supplying enchant
# as a system dependency AND writing the wordlist and filter module.
commands =
    sphinx-build -q -W --keep-going -b linkcheck {toxinidir}/docs {toxinidir}/docs/_build/linkcheck

[testenv:docs]
description = Build the documentation.
skip_install = true
deps = -r{toxinidir}/docs/requirements.txt
commands_pre =
whitelist_externals = sphinx-build
commands =
#    sphinx-apidoc -f -o {toxinidir}/docs {toxinidir}
    sphinx-build --color -b html {toxinidir}/docs {toxinidir}/docs/_build/html
    python -c 'import pathlib; print(f"Documentation is available under:", pathlib.Path(f"{toxinidir}") / "docs" / "_build" / "html" / "index.html")'

