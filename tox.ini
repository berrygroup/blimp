# NOTE: pytest configuration lives in pyproject.toml under
# [tool.pytest.ini_options]. pytest ignores a [pytest] section here whenever
# that table exists, so do not re-add one -- it will be silently inert.

[doc8]
max-line-length = 120
ignore-path = .tox,docs/api,blimp.egg-info,dist,build
quiet = 1

[flake8]
per-file-ignores =
    */__init__.py: D104, F401, I252
    tests/*: D, PT019
    docs/*: D,B
    notebooks/*: E402, E501, D100
# E402 module level import not at top of file
# E501 line too long
# D104 Missing docstring in public package
# F401 ... imported but unused
# D100 Missing docstring in public module
# D200 One-line docstring should fit on one line with quotes
# G004 Logging statement uses f-string
# G003 Logging statement uses '+'

# D100 D100 Missing docstring in public module
# D107 Missing docstring in __init__
# B008 Do not perform function calls in argument defaults.
# W503 line break before binary operator
# D105 Missing docstring in magic method
# E203 whitespace before ':'
# P101 format string does contain unindexed parameters
# PT019 fixture _ensure_test_data without value is injected as parameter, use @pytest.mark.usefixtures instead

# docrep interferences:
# RST201 Block quote ends without a blank line; unexpected unindent.
# RST301 Unexpected indentation.
# RST306 Unknown target name:
# RST203 Definition list ends without a blank line; unexpected unindent.
ignore = E203, D200, D100, D107, G004, G003 #,B008,W503,D105,E203,P101,RST201,RST301,RST306,RST203
exclude =
    .git
    .tox
    build
    dist
    __pycache__
    setup.py
max_line_length = 120
filename = *.py
ban-relative-imports = true
rst-roles =
    mod
    class
    meth
    func
    attr
    paramref
    ref
    cite
rst-directives =
    envvar
    exception

[coverage:run]
omit = */__init__.py

[coverage:paths]
source =
    blimp
    */site-packages/blimp

[coverage:report]
show_missing = true
precision = 2
skip_empty = True
sort = Cover

[tox]
isolated_build = True
envlist =
    py{310,311,312}-{linux,macos}
    lint
    clean-docs
    check-docs
    docs
    covclean
    coverage
skip_missing_interpreters = true

[testenv]
platform =
    linux: linux
    macos: (osx|darwin)
deps =
    pytest
    pytest-xdist
    pytest-cov
    pytest-dependency
    nbconvert
    ipykernel
extras = test
usedevelop = true
# The reference dataset (~200 MB) is fetched from Figshare before the suite
# runs. ``blimp.data.load_test_data`` is a no-op when the dataset is already
# extracted, so this costs nothing on repeat runs.
# Set BLIMP_SKIP_TEST_DATA=1 to run only the offline tests without network
# access; the data-dependent tests then skip rather than fail.
setenv =
    BLIMP_SKIP_TEST_DATA = {env:BLIMP_SKIP_TEST_DATA:0}
commands_pre =
    python {toxinidir}/tests/fetch_test_data.py
# --cov-report=xml is needed by CI (Codecov upload) and by the badge in the
# `coverage` env. Without it `tox -e py` writes only a terminal report, and the
# CI upload step silently finds no file.
commands =
    python -m pytest --cov --cov-append --cov-report=term-missing --cov-report=xml:{toxinidir}/tests/coverage/coverage.xml --junitxml={toxinidir}/tests/coverage/junit.xml --cov-config={toxinidir}/tox.ini --ignore docs/ {posargs:-vv} {env:PYTEST_FLAGS:}

[testenv:offline]
description = Run only the tests that need no network access or reference data.
extras = test
usedevelop = true
deps =
    pytest
    pytest-cov
commands = python -m pytest -m "not data" --cov --cov-report=term-missing {posargs}

[testenv:lint]
description = Perform linting.
basepython = python3.10
deps = pre-commit>=2.16.0
skip_install = true
commands = pre-commit run --all-files {posargs:}  # --show-diff-on-failure

[testenv:covclean]
description = Clean coverage files.
deps = coverage
skip_install = True
commands = coverage erase

[testenv:coverage]
description = Report the coverage.
deps =
    coverage
    genbadge[coverage,tests]
skip_install = true
depends = py{310,311,312}-{linux,macos}
parallel_show_output = True
commands =
    coverage report --omit="tox/*,tests/*"
    coverage xml --omit="tox/*,tests/*" -o {toxinidir}/tests/coverage/coverage.xml
    coverage html --omit="tox/*,tests/*" -d {toxinidir}/tests/coverage/html
    genbadge coverage -i {toxinidir}/tests/coverage/coverage.xml -o {toxinidir}/tests/coverage/coverage.svg
    genbadge tests -i {toxinidir}/tests/coverage/junit.xml -o {toxinidir}/tests/coverage/tests.svg

[testenv:clean-docs]
description = Clean the documentation artifacts.
basepython = python3.10
deps =
skip_install = true
changedir = {toxinidir}/docs
whitelist_externals = make
allowlist_externals = make
commands = make clean

[testenv:check-docs]
description = Check whether the links in the documentation are valid.
basepython = python3.10
deps = -r{toxinidir}/docs/requirements.txt
skip_install = true
whitelist_externals = sphinx-build
commands =
    sphinx-build -W --keep-going -b spelling {toxinidir}/docs {toxinidir}/docs/_build/spellcheck
    sphinx-build -q -W --keep-going -b linkcheck {toxinidir}/docs {toxinidir}/docs/_build/linkcheck

[testenv:docs]
description = Build the documentation.
basepython = python3.10
skip_install = true
deps = -r{toxinidir}/docs/requirements.txt
whitelist_externals = sphinx-build
commands =
#    sphinx-apidoc -f -o {toxinidir}/docs {toxinidir}
    sphinx-build --color -b html {toxinidir}/docs {toxinidir}/docs/_build/html
    python -c 'import pathlib; print(f"Documentation is available under:", pathlib.Path(f"{toxinidir}") / "docs" / "_build" / "html" / "index.html")'

