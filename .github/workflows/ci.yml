name: CI

on:
    push:
        branches:
        -   main
        -   master
    pull_request:
        branches:
        -   main
        -   master

# Superseded runs on the same branch are pointless: cancel them so a busy
# afternoon of pushes does not queue up hours of duplicated CI.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Enforcing: all hooks pass, so a failure here is a real regression.
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                cache: pip
        -   name: Run pre-commit
            uses: pre-commit/action@v3.0.1

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            # A failure specific to one OS or version is what the matrix exists
            # to reveal, so let the other legs finish.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ['3.10', '3.11', '3.12']
                # Maps runner OS to the tox factor. Without this only the
                # factor-less `tox -e py` is callable, which drops the platform
                # guard and leaves the -linux/-macos envs never exercised.
                include:
                -   os: ubuntu-latest
                    tox-platform: linux
                -   os: macos-latest
                    tox-platform: macos

        steps:
        -   name: Checkout code
            uses: actions/checkout@v4

        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
                cache: pip

        # ~200 MB from Figshare, otherwise re-downloaded by all 6 legs. Key is
        # pinned to the article id, so a new dataset invalidates the cache.
        -   name: Cache reference test dataset
            uses: actions/cache@v4
            with:
                # Both paths are required: load_test_data treats the dataset as
                # present only when both exist, so caching one re-downloads all.
                path: |
                    tests/_data
                    tests/_experiments
                    tests/_data.zip
                key: blimp-testdata-23972244

        # cellpose fetches pretrained weights on first use; cache them too.
        -   name: Cache cellpose models
            uses: actions/cache@v4
            with:
                path: ~/.cellpose
                key: cellpose-models-${{ runner.os }}

        -   name: Install tox
            run: |
                python -m pip install --upgrade pip
                python -m pip install tox tox-uv

        # Explicit env name rather than `-e py` so the platform guard applies.
        # uv defaults to --python-preference system, reusing setup-python's
        # interpreter rather than downloading one.
        -   name: Run tests
            run: |
                # 3.10 -> 310, matching the tox factor names.
                tox -e "py${PYVER//./}-${{ matrix.tox-platform }}"
            env:
                PYVER: ${{ matrix.python-version }}

        # Keep at v5 or later: v4 has no tokenless upload, so coverage does not
        # report on fork PRs, where `secrets` is empty.
        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v5
            with:
                files: ./tests/coverage/coverage.xml
                flags: ${{ runner.os }}-py${{ matrix.python-version }}
                token: ${{ secrets.CODECOV_TOKEN }}
                # False so a Codecov outage cannot fail a passing run; the cost
                # is that a broken upload is silent.
                fail_ci_if_error: false

        # Makes failures diagnosable without re-running CI locally.
        -   name: Upload test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
                path: |
                    tests/coverage/junit.xml
                    tests/coverage/coverage.xml
                if-no-files-found: ignore
