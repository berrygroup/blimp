name: CI

on:
    push:
        branches:
        -   main
        -   master
    pull_request:
        branches:
        -   main
        -   master

# Superseded runs on the same branch are pointless: cancel them so a busy
# afternoon of pushes does not queue up hours of duplicated CI.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Cheap and fails fast, so run it as its own job rather than making
        # every matrix leg wait on it.
        #
        # This job is enforcing: `pre-commit run --all-files` passes on every
        # hook as of the commit that removed `continue-on-error`. The three that
        # used to fail (mypy, autoflake, pyupgrade) have been fixed rather than
        # excluded, so a new failure here is a real regression.
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                cache: pip
        -   name: Run pre-commit
            uses: pre-commit/action@v3.0.1

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            # Do not cancel the whole matrix when one leg fails -- a failure
            # specific to one OS or Python version is exactly what the matrix
            # exists to reveal.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ['3.10', '3.11', '3.12']
                # The tox envs are named py{310,311,312}-{linux,macos}, so the
                # runner OS has to be mapped to the factor tox expects. Without
                # this the workflow can only invoke the factor-less `tox -e py`,
                # which drops the `platform` guard and means the -linux/-macos
                # envs are never actually exercised in CI.
                include:
                -   os: ubuntu-latest
                    tox-platform: linux
                -   os: macos-latest
                    tox-platform: macos

        steps:
        -   name: Checkout code
            uses: actions/checkout@v4

        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
                cache: pip

        # The reference dataset is ~200 MB from Figshare. Without a cache every
        # matrix leg re-downloads it (6 legs = ~1.2 GB per run), which is slow
        # and impolite to Figshare. The key is pinned to the Figshare article
        # id, so publishing a new dataset invalidates the cache.
        -   name: Cache reference test dataset
            uses: actions/cache@v4
            with:
                # The zip extracts to BOTH tests/_data and tests/_experiments,
                # and blimp.data.load_test_data treats the dataset as present
                # only when both exist. Caching just _data means the guard fails
                # on a cache hit and the whole archive is downloaded again.
                path: |
                    tests/_data
                    tests/_experiments
                    tests/_data.zip
                key: blimp-testdata-23972244

        # cellpose fetches pretrained weights on first use; cache them too.
        -   name: Cache cellpose models
            uses: actions/cache@v4
            with:
                path: ~/.cellpose
                key: cellpose-models-${{ runner.os }}

        -   name: Install tox
            run: |
                python -m pip install --upgrade pip
                python -m pip install tox tox-uv

        # tox's commands_pre downloads the dataset if the cache missed.
        #
        # The env name is explicit rather than `-e py` so the platform guard is
        # exercised and the leg fails loudly if the interpreter is wrong. uv runs
        # with --python-preference system, so this reuses the setup-python
        # interpreter above rather than downloading its own.
        -   name: Run tests
            run: |
                # 3.10 -> 310, matching the tox factor names.
                tox -e "py${PYVER//./}-${{ matrix.tox-platform }}"
            env:
                PYVER: ${{ matrix.python-version }}

        # v5 (not v4): v4 required a token even for public repos, and its
        # tokenless path for forked PRs was removed. v5 restores tokenless
        # upload for public repos, so coverage still reports on PRs from forks
        # where `secrets` is empty.
        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v5
            with:
                files: ./tests/coverage/coverage.xml
                flags: ${{ runner.os }}-py${{ matrix.python-version }}
                token: ${{ secrets.CODECOV_TOKEN }}
                # Deliberately false: a Codecov outage should not fail a run
                # whose tests all passed. The cost is that a broken upload is
                # silent, so check the PR comment appears -- codecov.yml waits
                # for all six legs before commenting.
                fail_ci_if_error: false

        # Makes failures diagnosable without re-running CI locally.
        -   name: Upload test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
                path: |
                    tests/coverage/junit.xml
                    tests/coverage/coverage.xml
                if-no-files-found: ignore
