name: CI

# `dev` is the integration branch: feature branches are merged there and
# promoted to main as releases, so it needs the same gating as main. Listing it
# under both events is deliberate -- `pull_request` gates merges into dev, and
# `push` re-runs the suite on the merge commit, which is the first time the
# combined state of two independently-green PRs is ever tested.
#
# A branch listed under `push` but not `pull_request` would run CI twice per PR
# (once for the branch push, once for the PR); feature branches are in neither,
# so they are tested by their PR only.
on:
    push:
        branches:
        -   main
        -   master
        -   dev
    pull_request:
        branches:
        -   main
        -   master
        -   dev

# Superseded runs on the same branch are pointless: cancel them so a busy
# afternoon of pushes does not queue up hours of duplicated CI.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Enforcing: all hooks pass, so a failure here is a real regression.
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                cache: pip
        -   name: Run pre-commit
            uses: pre-commit/action@v3.0.1

    docs:
        # Read the Docs publishes the docs, but has no fail_on_warning, so it
        # ships warning-laden output with a green badge. This job is the gate:
        # -W turns any Sphinx warning into a PR failure. It caught nothing at
        # the time of writing only because the stale-autosummary and RST faults
        # were just fixed -- that class of break is silent otherwise.
        #
        # Build only, no linkcheck: linkcheck resolves every external URL in the
        # docs, so it reddens PRs for link rot the author did not cause. Run
        # `tox -e check-docs` by hand for link coverage.
        #
        # Deliberately not a separate workflow: a job here is covered by the
        # existing CI badge, whereas a docs.yml would need its own.
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4

            # 3.12 is required, not preference: on 3.11 the newest installable
            # sphinx-autodoc-typehints still calls Parser.set_application, which
            # Sphinx 10 removes. See [testenv:docs] in tox.ini.
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.12'
                cache: pip

        -   name: Install tox
            run: |
                python -m pip install --upgrade pip
                python -m pip install tox tox-uv

            # clean-docs first is load-bearing: docs/api is autosummary output
            # written into the source tree, so a stale entry from a renamed
            # module becomes a fatal warning under -W. Ordinarily a fresh
            # checkout has no docs/api, but the pip cache above means this
            # cannot be assumed.
        -   name: Build docs (warnings are errors)
            run: tox -e clean-docs,docs -- -W --keep-going
            env:
                # Drops intersphinx_mapping (see docs/conf.py). Without this the
                # gate depends on 15 third-party sites staying up, and Sphinx
                # warns once per unreachable target with no [type.subtype] tag,
                # so suppress_warnings cannot single those out -- one blip would
                # fail an unrelated PR. Read the Docs builds with the mappings
                # live, so cross-reference links are still exercised there.
                BLIMP_DOCS_OFFLINE: '1'

            # The built HTML, so a failure is inspectable without a local build.
        -   name: Upload built docs
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: docs-html
                path: docs/_build/html
                if-no-files-found: ignore

    # actions/cache writes its entry when a job ends, and the six test legs
    # start together, so without this they would all miss on the first run and
    # pull ~200 MB from Figshare at once. This job populates the cache once and
    # the legs restore from it. It needs no compiled dependencies: blimp.data
    # imports with requests and tqdm alone, so the package is not installed.
    testdata:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.12'
                cache: pip

            # Same key and paths as the test job; keep the three in step.
        -   name: Cache reference test dataset
            id: cache
            uses: actions/cache@v4
            with:
                path: |
                    tests/_data
                    tests/_experiments
                    tests/_data.zip
                key: blimp-testdata-23972244

        -   name: Download reference dataset
            if: steps.cache.outputs.cache-hit != 'true'
            run: |
                python -m pip install --upgrade pip
                python -m pip install requests tqdm
                python tests/fetch_test_data.py

    test:
        # Wait for the dataset cache to exist rather than racing to fill it.
        needs: testdata
        runs-on: ${{ matrix.os }}
        strategy:
            # A failure specific to one OS or version is what the matrix exists
            # to reveal, so let the other legs finish.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ['3.10', '3.11', '3.12']
                # Maps runner OS to the tox factor. Without this only the
                # factor-less `tox -e py` is callable, which drops the platform
                # guard and leaves the -linux/-macos envs never exercised.
                #
                # The Linux legs run inside a Rocky 8.10 container because that
                # is the lab's deployment target: el8 ships glibc 2.28, where
                # ubuntu-latest has 2.39. That gap is not cosmetic -- it selects
                # which manylinux wheels pip is allowed to install, so a
                # dependency can resolve on the runner and be unavailable on the
                # server. Testing on Ubuntu alone cannot see that class of break.
                #
                # The container runs on GitHub's Ubuntu runner, so the kernel is
                # still theirs; what is being tested is userspace -- glibc,
                # libstdc++, and the resolved wheel set.
                include:
                -   os: ubuntu-latest
                    tox-platform: linux
                    container: quay.io/rockylinux/rockylinux:8.10
                    # `os` still reads ubuntu-latest (it is the host runner), so
                    # without this the check name would claim Ubuntu while
                    # running Rocky. Used for the check name, the uploaded
                    # artifact and the coverage flag.
                    label: rocky8
                -   os: macos-latest
                    tox-platform: macos
                    label: macos

        name: test (${{ matrix.label }}, py${{ matrix.python-version }})

        # Empty string on macOS, which GitHub treats as "no container".
        container: ${{ matrix.container }}

        steps:
        # Rocky 8's minimal image has no git, no tar and no compiler. git is
        # required before checkout (actions/checkout falls back to a slower
        # REST download without it, losing the tags setuptools_scm needs for
        # the version), and gcc is required because `welford` ships an sdist
        # only. Installed before checkout so the action can use git.
        #
        # dnf, not the setup-python action: that action has no CentOS/RHEL
        # builds in its versions manifest and fails on el8 images.
        -   name: Install system packages (Rocky only)
            if: matrix.container != ''
            run: |
                dnf -y install git tar gzip gcc gcc-c++ make findutils which
                git --version
                cat /etc/os-release | head -2
                ldd --version | head -1

        -   name: Checkout code
            uses: actions/checkout@v4

        # Rocky 8's AppStream has no python3.10, so setup-python cannot supply
        # the matrix versions even where it works. uv can: tox-uv fetches a
        # standalone build for whichever factor is requested. `git config` is
        # needed because checkout inside a container leaves the tree owned by a
        # different uid than the running user, and setuptools_scm shells out to
        # git for the version.
        -   name: Set up Python ${{ matrix.python-version }}
            if: matrix.container == ''
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
                cache: pip

        -   name: Set up bootstrap Python (Rocky)
            if: matrix.container != ''
            run: |
                # Checkout inside a container leaves the tree owned by a uid the
                # running user does not match, and setuptools_scm shells out to
                # git for the version.
                git config --global --add safe.directory "$GITHUB_WORKSPACE"

                # el8's default python3 is 3.6, too old to run modern tox, so a
                # newer interpreter is needed just to bootstrap. Probed rather
                # than hardcoded: which python3.N modules AppStream carries has
                # changed across point releases, and a hardcoded name turns a
                # missing package into a confusing failure three steps later.
                for v in 3.12 3.11 3.9; do
                    if dnf -y install "python$v" "python$v-pip" >/dev/null 2>&1; then
                        echo "BOOTSTRAP_PYTHON=python$v" >> "$GITHUB_ENV"
                        echo "bootstrap interpreter: $(python$v --version)"
                        break
                    fi
                done
                if ! grep -q BOOTSTRAP_PYTHON "$GITHUB_ENV"; then
                    echo "::error::no python3.9+ package available in this image"
                    dnf -y module list python39 python311 python312 || true
                    exit 1
                fi

        # Restores the entry the testdata job populated; the key is not
        # OS-scoped, so all six legs share one copy. Key is pinned to the
        # article id, so a new dataset invalidates the cache.
        -   name: Cache reference test dataset
            uses: actions/cache@v4
            with:
                # Both paths are required: load_test_data treats the dataset as
                # present only when both exist, so caching one re-downloads all.
                path: |
                    tests/_data
                    tests/_experiments
                    tests/_data.zip
                key: blimp-testdata-23972244

        # cellpose fetches pretrained weights on first use; cache them too.
        -   name: Cache cellpose models
            uses: actions/cache@v4
            with:
                path: ~/.cellpose
                key: cellpose-models-${{ runner.os }}

        # `python` is unversioned on Rocky 8 -- only python3.N exists -- so the
        # bootstrap interpreter is named explicitly. It only has to run tox;
        # the interpreter under test is chosen by the tox factor below.
        -   name: Install tox
            run: |
                # BOOTSTRAP_PYTHON is set via GITHUB_ENV by the Rocky step above
                # and unset on macOS, where setup-python puts `python` on PATH.
                PY="${BOOTSTRAP_PYTHON:-python}"
                "$PY" -m pip install --upgrade pip
                "$PY" -m pip install tox tox-uv

        # Explicit env name rather than `-e py` so the platform guard applies.
        #
        # UV_PYTHON_PREFERENCE differs by leg deliberately. On the hosted
        # runners uv defaults to `system` and reuses setup-python's interpreter.
        # In the Rocky container the only system interpreter is 3.12, so `system`
        # would silently run the 3.10 and 3.11 legs on 3.12 -- three legs
        # claiming versions they never tested. `only-managed` forces uv to fetch
        # the requested standalone build instead, which is also what makes 3.10
        # testable at all, since el8 AppStream has no python3.10 package.
        -   name: Run tests
            run: |
                # 3.10 -> 310, matching the tox factor names.
                PY="${BOOTSTRAP_PYTHON:-python}"
                "$PY" -m tox -e "py${PYVER//./}-${{ matrix.tox-platform }}"
            env:
                PYVER: ${{ matrix.python-version }}
                UV_PYTHON_PREFERENCE: ${{ matrix.container != '' && 'only-managed' || 'system' }}

        # Keep at v5 or later: v4 has no tokenless upload, so coverage does not
        # report on fork PRs, where `secrets` is empty.
        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v5
            with:
                files: ./tests/coverage/coverage.xml
                # matrix.label, not runner.os: inside the container runner.os is
                # "Linux", which does not distinguish Rocky from the Ubuntu host
                # and would silently merge with any future Ubuntu leg's flag.
                flags: ${{ matrix.label }}-py${{ matrix.python-version }}
                token: ${{ secrets.CODECOV_TOKEN }}
                # False so a Codecov outage cannot fail a passing run; the cost
                # is that a broken upload is silent.
                fail_ci_if_error: false

        # Makes failures diagnosable without re-running CI locally.
        -   name: Upload test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: test-results-${{ matrix.label }}-py${{ matrix.python-version }}
                path: |
                    tests/coverage/junit.xml
                    tests/coverage/coverage.xml
                if-no-files-found: ignore
