name: CI

on:
    push:
        branches:
        -   main
        -   master
    pull_request:
        branches:
        -   main
        -   master

# Superseded runs on the same branch are pointless: cancel them so a busy
# afternoon of pushes does not queue up hours of duplicated CI.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Cheap and fails fast, so run it as its own job rather than making
        # every matrix leg wait on it.
        #
        # NOTE: black and isort now pass cleanly across the tree (see the
        # formatting-only commit that applied the pinned versions). Three hooks
        # still fail, all pre-existing and all needing real code changes rather
        # than reformatting, so `continue-on-error` stays for now:
        #
        #   mypy==1.7.1   5 errors. 4 are indexed assignment on an Optional in
        #                 segment.py (needs a None check or an assert); 1 is a
        #                 Path assigned to a str-annotated variable in
        #                 convert_nd2.py, next to two existing `# type: ignore`
        #                 comments on the same pattern.
        #   autoflake     10 files with unused imports (mostly `import os`).
        #                 The hook runs with --in-place --remove-all-unused-
        #                 imports, i.e. it deletes code, so it wants review
        #                 rather than a blind apply.
        #   pyupgrade     1 file.
        #
        # Fix those three, then delete this line so lint becomes enforcing.
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                cache: pip
        -   name: Run pre-commit
            uses: pre-commit/action@v3.0.1

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            # Do not cancel the whole matrix when one leg fails -- a failure
            # specific to one OS or Python version is exactly what the matrix
            # exists to reveal.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                python-version: ['3.10', '3.11', '3.12']

        steps:
        -   name: Checkout code
            uses: actions/checkout@v4

        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
                cache: pip

        # The reference dataset is ~200 MB from Figshare. Without a cache every
        # matrix leg re-downloads it (6 legs = ~1.2 GB per run), which is slow
        # and impolite to Figshare. The key is pinned to the Figshare article
        # id, so publishing a new dataset invalidates the cache.
        -   name: Cache reference test dataset
            uses: actions/cache@v4
            with:
                # The zip extracts to BOTH tests/_data and tests/_experiments,
                # and blimp.data.load_test_data treats the dataset as present
                # only when both exist. Caching just _data means the guard fails
                # on a cache hit and the whole archive is downloaded again.
                path: |
                    tests/_data
                    tests/_experiments
                    tests/_data.zip
                key: blimp-testdata-23972244

        # cellpose fetches pretrained weights on first use; cache them too.
        -   name: Cache cellpose models
            uses: actions/cache@v4
            with:
                path: ~/.cellpose
                key: cellpose-models-${{ runner.os }}

        -   name: Install tox
            run: |
                python -m pip install --upgrade pip
                python -m pip install tox

        # tox's commands_pre downloads the dataset if the cache missed.
        -   name: Run tests
            run: tox -e py

        -   name: Upload coverage to Codecov
            uses: codecov/codecov-action@v4
            with:
                files: ./tests/coverage/coverage.xml
                flags: ${{ runner.os }}-py${{ matrix.python-version }}
                token: ${{ secrets.CODECOV_TOKEN }}
                fail_ci_if_error: false

        # Makes failures diagnosable without re-running CI locally.
        -   name: Upload test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
                path: |
                    tests/coverage/junit.xml
                    tests/coverage/coverage.xml
                if-no-files-found: ignore
