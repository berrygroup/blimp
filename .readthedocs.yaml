version: 2

build:
    # ubuntu-20.04 was removed by Read the Docs on 2026-06-01; supported
    # values are ubuntu-22.04, ubuntu-24.04 and ubuntu-lts-latest.
    os: ubuntu-24.04
    tools:
        # Must be >=3.12, matching [testenv:docs] in tox.ini: on 3.11 and below
        # the newest installable sphinx-autodoc-typehints (3.6.1) still calls
        # Parser.set_application, which Sphinx 10 removes.
        python: '3.12'

python:
    install:
    -   method: pip
        path: .
    -   requirements: docs/requirements.txt

sphinx:
    configuration: docs/conf.py
